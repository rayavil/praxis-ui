name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permisos mínimos y explícitos requeridos para publicar en GitHub Pages
# mediante el flujo oficial de despliegue (OIDC + escritura de Pages).
permissions:
  contents: read
  pages: write
  id-token: write

# Evita despliegues solapados: si llega un push nuevo, se espera a que
# termine el despliegue en curso antes de lanzar el siguiente.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar sitio (astro build)
        run: npm run build

      - name: Subir artefacto de build
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
